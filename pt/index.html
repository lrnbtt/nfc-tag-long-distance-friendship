<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14132b">
<link rel="icon" href="icon-192.png">
<title>Thinking of you</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #14132b; color: #ece9ff; font-family: system-ui, sans-serif; }
  section { display: none; height: 100%; flex-direction: column; }
  section.on { display: flex; }
  #mood { justify-content: center; gap: 1.2rem; padding: 1.5rem; max-width: 28rem; margin-inline: auto; }
  h1 { font-size: 1.4rem; font-weight: 500; margin: 0; }
  .grid { display: grid; gap: .75rem; }
  button { display: flex; align-items: center; gap: .9rem; font: inherit; font-size: 1.15rem; color: inherit;
           background: #1f1d42; border: 2px solid var(--c); border-radius: 1rem; padding: 1rem 1.2rem;
           text-align: left; cursor: pointer; }
  button span { font-size: 1.6rem; }
  button:active, button.sent { background: var(--c); color: #14132b; }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .small { font-size: 1rem; padding: .7rem 1rem; }
  #msg { min-height: 1.5rem; margin: 0; color: #b9b4e6; }
  a { color: #b9b4e6; }
  canvas { flex: 1; width: 100%; min-height: 0; }
  #stats { padding: 1rem 1.5rem 1.5rem; line-height: 1.6; }
  #stats p { margin: 0; }

  #wrap { position: relative; flex: 1; min-height: 0; }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ghost { position: absolute; left: 50%; bottom: 6%; width: 9rem; transform: translateX(-50%); overflow: visible; pointer-events: none; }
  #body { pointer-events: auto; cursor: pointer; }
  #ghost text { text-anchor: middle; }
  .eyes-shut, .eyes-happy, .props text { display: none; }
  .m-peace .eyes-open, .m-happy .eyes-open, .m-wait .eyes-open { display: none; }
  .m-peace .eyes-shut, .m-wait .eyes-shut, .m-happy .eyes-happy { display: inline; }
  .m-peace .p-peace, .m-happy .p-happy, .m-missing .p-missing, .m-energy .p-energy, .m-chaos .p-chaos, .m-wait .p-wait { display: inline; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes zoom { 0%, 100% { transform: translateX(-60px); } 50% { transform: translateX(60px); } }
  @keyframes wob { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes flick { 50% { opacity: .5; } }
  @keyframes flap { 50% { transform: scaleX(.86); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes hide { 0%, 100% { transform: scale(1); } 30%, 70% { transform: scale(.08); } }
  @keyframes sneeze { 40% { transform: translateY(6px) scale(1.06, .92); } 60% { transform: translateX(14px) rotate(6deg); } }
  @keyframes jump { 30% { transform: translateY(-18px); } 60% { transform: translateY(0); } 80% { transform: translateY(-8px); } }
  #body { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 4s ease-in-out infinite; }
  #wings { transform-box: fill-box; transform-origin: 50% 50%; animation: flap 2.5s ease-in-out infinite; }
  #tapfx { transform-box: fill-box; transform-origin: 50% 70%; }
  .fx-spin { animation: spin .8s ease-in-out; }
  .fx-hide { animation: hide 1.2s ease-in-out; transform-origin: 50% 100% !important; }
  .fx-sneeze { animation: sneeze .7s ease-out; }
  .fx-confetti { animation: jump 1s ease-out; }
  .m-peace #body { animation-duration: 7s; }
  .m-peace #wings { animation-duration: 6s; }
  .m-happy #body { animation: sway 1s ease-in-out infinite; }
  .m-happy #wings { animation-duration: .6s; }
  .m-energy #body { animation: zoom .9s ease-in-out infinite; }
  .m-energy #wings { animation-duration: .25s; }
  .m-chaos #body { animation: wob .25s linear infinite; }
  .m-wait #body { animation-duration: 9s; }
  .m-wait #wings { animation: none; transform: scaleX(.55); }
  .p-chaos { animation: flick .4s infinite; }
  #notes p { color: #f6c453; }
  #cname { color: #f6c453; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { #body, #wings, #tapfx, .props text { animation: none !important; } }
</style>
<script src="firebase-config.js"></script>
<script>document.head.insertAdjacentHTML("beforeend", '<link rel="manifest" href="manifest' + (self.GHOST.lang === "pt" ? "-pt" : "") + '.webmanifest">');</script>
</head>
<body>
<section id="mood">
  <h1 id="hi">How does it feel today?</h1>
  <div class="grid" id="moods">
    <button data-m="peace" style="--c:#7bd389"><span>🌿</span>Peace</button>
    <button data-m="missing" style="--c:#c9d3e6"><span>🌙</span>Missing you</button>
    <button data-m="happy" style="--c:#f6c453"><span>☀️</span>Happy</button>
    <button data-m="energy" style="--c:#5aa9ff"><span>⚡</span>Need energy</button>
    <button data-m="chaos" style="--c:#ff6a4d"><span>🔥</span>Chaos</button>
  </div>
  <p id="msg" role="status"></p>
  <button id="buzz" class="small" style="--c:#b9b4e6" data-t="buzz" hidden>Turn on buzzes</button>
  <button id="install" class="small" style="--c:#b9b4e6" data-t="install" hidden>Add to home screen</button>
  <a href="#sky" data-t="seeSky">See our sky</a>
</section>
<section id="sky">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <svg id="ghost" viewBox="0 0 120 150" role="img" aria-label="Our friendship mothman">
      <g class="props">
        <text class="p-peace" x="104" y="140" font-size="44">🌳</text>
        <text class="p-peace" x="98" y="30" font-size="20">💤</text>
        <text class="p-wait" x="98" y="30" font-size="20">💤</text>
        <text class="p-happy" x="106" y="40" font-size="20">✨</text>
        <text class="p-happy" x="14" y="40" font-size="20">✨</text>
        <text class="p-missing" x="98" y="26" font-size="24">🌠</text>
        <text class="p-energy" x="10" y="80" font-size="22">⚡</text>
        <text class="p-chaos" x="104" y="76" font-size="26">🔥</text>
        <text class="p-chaos" x="16" y="120" font-size="22">🔥</text>
      </g>
      <g id="tapfx"><g id="body" role="button" tabindex="0" aria-label="Tap the mothman">
        <g id="wings">
          <path d="M58 62 C22 18 2 50 8 92 C12 114 40 110 58 98 Z" fill="#7a68b0"/>
          <path d="M62 62 C98 18 118 50 112 92 C108 114 80 110 62 98 Z" fill="#7a68b0"/>
          <circle cx="26" cy="76" r="8" fill="#f6c453"/><circle cx="26" cy="76" r="3.5" fill="#14132b"/>
          <circle cx="94" cy="76" r="8" fill="#f6c453"/><circle cx="94" cy="76" r="3.5" fill="#14132b"/>
        </g>
        <path d="M52 36 Q40 10 28 14 M68 36 Q80 10 92 14" stroke="#cfc6e8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="28" cy="14" r="3" fill="#cfc6e8"/><circle cx="92" cy="14" r="3" fill="#cfc6e8"/>
        <ellipse cx="60" cy="96" rx="24" ry="30" fill="#cfc6e8"/>
        <ellipse cx="60" cy="106" rx="13" ry="16" fill="#ece9ff"/>
        <ellipse cx="50" cy="126" rx="8" ry="5" fill="#cfc6e8"/><ellipse cx="70" cy="126" rx="8" ry="5" fill="#cfc6e8"/>
        <circle cx="60" cy="56" r="25" fill="#cfc6e8"/>
        <g class="eyes-open"><circle cx="48" cy="56" r="9" fill="#ff5a64"/><circle cx="72" cy="56" r="9" fill="#ff5a64"/><circle cx="45" cy="53" r="3" fill="#fff"/><circle cx="69" cy="53" r="3" fill="#fff"/></g>
        <g class="eyes-shut"><path d="M40 57 q8 7 16 0 M64 57 q8 7 16 0" stroke="#14132b" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="eyes-happy"><path d="M40 59 q8 -9 16 0 M64 59 q8 -9 16 0" stroke="#14132b" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <ellipse cx="38" cy="68" rx="5" ry="3.5" fill="#ff9db8" opacity=".6"/><ellipse cx="82" cy="68" rx="5" ry="3.5" fill="#ff9db8" opacity=".6"/>
        <path d="M55 68 q5 4 10 0" stroke="#14132b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <g id="costume"></g>
        <text id="acc" x="60" y="34" font-size="28"></text>
      </g></g>
      <text id="fx" x="60" y="12" font-size="22"></text>
      <text id="pet" x="14" y="140" font-size="26"></text>
    </svg>
  </div>
  <div id="stats"><p id="cname"></p><p id="s1"></p><p id="s2"></p><p id="s3"></p><p id="s4"></p><div id="notes"></div><p><a href="#" data-t="back">Back</a></p></div>
</section>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getMessaging, getToken, onMessage, isSupported } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

  const G = self.GHOST;
  const LANG = G.lang === 'pt' ? 'pt' : 'en';
  const PNOUN = [['Bule','m'],['Lanterna','f'],['Biscoito','m'],['Meia','f'],['Guarda-chuva','m'],['Sapo','m'],['Pipa','f'],['Xícara','f'],['Mariposa','f'],['Cogumelo','m'],['Carrinho de mão','m'],['Coruja','f']];
  const PADJ = [['Sonolento','Sonolenta'],['Sorrateiro','Sorrateira'],['Risonho','Risonha'],['Rabugento','Rabugenta'],['Aconchegante','Aconchegante'],['Cambaleante','Cambaleante'],['Enluarado','Enluarada'],['Brilhante','Brilhante'],['Misterioso','Misteriosa'],['Fofinho','Fofinha'],['Tonto','Tonta'],['Valente','Valente']];
  const TT = {
    en: {
      title: 'Thinking of you', hi: 'How does it feel today?', hiName: n => 'Hi ' + n + ', how does it feel today?',
      link: 'Tap your charm to link this phone.', unknown: T.unknown,
      offline: T.offline, sent: 'Sent ',
      fail: T.fail,
      buzzOn: T.buzzOn, buzzFail: T.buzzFail,
      buzzOff: T.buzzOff,
      buzz: 'Turn on buzzes', install: 'Add to home screen', seeSky: 'See our sky', back: 'Back',
      ghostLabel: 'Our friendship mothman', tapLabel: 'Tap the mothman',
      moods: { peace: 'Peace', missing: 'Missing you', happy: 'Happy', energy: 'Need energy', chaos: 'Chaos' },
      now: 'just now', min: m => m + ' min ago',
      hrs: h => h + (h === 1 ? ' hour' : ' hours') + ' ago', days: d => d + (d === 1 ? ' day' : ' days') + ' ago',
      twin: ' ✨ Twin Star!', crown: ' 👑 100th thought: your mothman got a crown!', galaxy: ' 🌌 1000th thought: a new galaxy!',
      seasons: ['Spring', 'Summer', 'Autumn', 'Winter'],
      bday: names => '🎂 Birthday constellation for ' + names.join(' and '),
      fday: y => '🌟 Friendship Day: ' + y + ' year' + (y > 1 ? 's' : '') + ' since your first tap',
      twins: k => '✨ ' + k + ' twin stars in your sky',
      season: 'Season: ', age: d => 'Mothman age: ' + d + ' days', together: y => ' · ' + y + ' year(s) together',
      empty: 'No stars yet. Tap the charm to make the first one.',
      thoughts: 'Thoughts shared: ', last: 'Last thought: ', waiting: ' · Mothman is curled up, waiting 💤',
      hint: T.hint, forming: h => ' (still forming: ' + h + ' of 6 stars)',
      con: g => 'The ' + ADJ[Math.floor(rnd(g + 1, 91.7) * ADJ.length)] + ' ' + NOUN[Math.floor(rnd(g + 1, 17.3) * NOUN.length)],
      taps: { spin: 'Wheee!', hide: 'Peekaboo!', sneeze: 'Achoo!', confetti: 'Secret! The mothman loves you both 💜' }
    },
    pt: {
      title: 'Pensando em você', hi: 'Como você está se sentindo hoje?', hiName: n => 'Oi, ' + n + '! Como você está se sentindo hoje?',
      link: 'Aproxime seu amuleto do celular para conectá-lo.', unknown: 'Este amuleto não foi reconhecido.',
      offline: 'Não foi possível falar com o servidor. Verifique sua conexão.', sent: 'Enviado ',
      fail: 'Não foi possível enviar. Verifique sua conexão e tente de novo.',
      buzzOn: 'Vibrações ativadas.', buzzFail: 'Não foi possível ativar as vibrações. Tente de novo.',
      buzzOff: 'As vibrações estão desativadas. Você pode ativá-las nas configurações do celular.',
      buzz: 'Ativar vibrações', install: 'Adicionar à tela inicial', seeSky: 'Ver nosso céu', back: 'Voltar',
      ghostLabel: 'Nosso Homem-Mariposa da amizade', tapLabel: 'Toque no Homem-Mariposa',
      moods: { peace: 'Paz', missing: 'Saudade', happy: 'Feliz', energy: 'Preciso de energia', chaos: 'Caos' },
      now: 'agora mesmo', min: m => 'há ' + m + ' min',
      hrs: h => 'há ' + h + (h === 1 ? ' hora' : ' horas'), days: d => 'há ' + d + (d === 1 ? ' dia' : ' dias'),
      twin: ' ✨ Estrela Gêmea!', crown: ' 👑 100º pensamento: o Homem-Mariposa ganhou uma coroa!', galaxy: ' 🌌 1000º pensamento: uma nova galáxia!',
      seasons: ['Primavera', 'Verão', 'Outono', 'Inverno'],
      bday: names => '🎂 Constelação de aniversário de ' + names.join(' e '),
      fday: y => '🌟 Dia da Amizade: ' + y + (y > 1 ? ' anos' : ' ano') + ' desde o primeiro toque',
      twins: k => '✨ ' + k + (k === 1 ? ' estrela gêmea' : ' estrelas gêmeas') + ' no seu céu',
      season: 'Estação: ', age: d => 'Idade do Homem-Mariposa: ' + d + (d === 1 ? ' dia' : ' dias'),
      together: y => ' · ' + y + (y === 1 ? ' ano juntos' : ' anos juntos'),
      empty: 'Ainda não há estrelas. Aproxime o amuleto para criar a primeira.',
      thoughts: 'Pensamentos compartilhados: ', last: 'Último pensamento: ', waiting: ' · O Homem-Mariposa está encolhido, esperando 💤',
      hint: 'Toque em uma estrela ou no Homem-Mariposa', forming: h => ' (ainda se formando: ' + h + ' de 6 estrelas)',
      con: g => { const n = PNOUN[Math.floor(rnd(g + 1, 17.3) * PNOUN.length)], a = PADJ[Math.floor(rnd(g + 1, 91.7) * PADJ.length)], f = n[1] === 'f';
                  return (f ? 'A ' : 'O ') + n[0] + ' ' + (f ? a[1] : a[0]); },
      taps: { spin: 'Uhuu!', hide: 'Achou!', sneeze: 'Atchim!', confetti: 'Segredo! O Homem-Mariposa ama vocês dois 💜' }
    }
  };
  const T = TT[LANG];
  const $ = id => document.getElementById(id);
  const COL = { peace: '#7bd389', missing: '#c9d3e6', happy: '#f6c453', energy: '#5aa9ff', chaos: '#ff6a4d' };
  const NAME = T.moods;
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };

  const qs = new URLSearchParams(location.search);
  if (qs.get('t')) {
    store.set('t', qs.get('t'));
    history.replaceState(null, '', location.pathname + location.hash);
  }
  const token = store.get('t');
  let state = { name: '', events: [] };
  let messaging = null;
  const post = body => fetch(G.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                      body: JSON.stringify(body) }).then(r => r.json());

  function show() {
    const sky = location.hash === '#sky';
    $('mood').classList.toggle('on', !sky);
    $('sky').classList.toggle('on', sky);
    if (sky) drawSky();
  }
  addEventListener('hashchange', show);
  addEventListener('resize', () => location.hash === '#sky' && drawSky());

  const moodButtons = [...document.querySelectorAll('#moods button')];

  function loadState() {
    return fetch(G.api + '?t=' + encodeURIComponent(token)).then(r => r.json()).then(s => {
      if (s.error) { $('hi').textContent = 'This charm is not recognised.'; return; }
      state = s;
      $('hi').textContent = T.hiName(s.name);
      if (location.hash === '#sky') drawSky();
    }).catch(() => { $('msg').textContent = "Couldn't reach the server. Check your connection."; });
  }

  moodButtons.forEach(b => b.addEventListener('click', () => {
    moodButtons.forEach(x => (x.disabled = true));
    post({ t: token, mood: b.dataset.m }).then(j => {
      if (!j.ok) throw 0;
      state.events.push({ n: state.events.length + 1, ts: Date.now(), sender: state.name, mood: b.dataset.m });
      b.classList.add('sent');
      navigator.vibrate && navigator.vibrate(30);
      $('msg').textContent = T.sent + b.firstChild.textContent + special();
      setTimeout(() => { b.classList.remove('sent'); moodButtons.forEach(x => (x.disabled = false)); }, 2500);
    }).catch(() => {
      $('msg').textContent = "That didn't send. Check your connection and try again.";
      moodButtons.forEach(x => (x.disabled = false));
    });
  }));

  // ---- buzzes (push notifications) ----
  async function registerDevice() {
    const reg = await navigator.serviceWorker.ready;
    const dt = await getToken(messaging, { vapidKey: G.vapidKey, serviceWorkerRegistration: reg });
    if (dt && dt !== store.get('dt:' + token)) {
      const j = await post({ t: token, action: 'register', device: dt });
      if (j.ok) store.set('dt:' + token, dt);
    }
  }
  $('buzz').addEventListener('click', async () => {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      try { await registerDevice(); $('buzz').hidden = true; $('msg').textContent = 'Buzzes are on.'; }
      catch { $('msg').textContent = "Couldn't turn on buzzes. Please try again."; }
    } else {
      $('msg').textContent = 'Buzzes are off. You can turn them on in your phone settings.';
    }
  });

  let installEvt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
  $('install').addEventListener('click', () => { installEvt && installEvt.prompt(); $('install').hidden = true; });

  // ---- sky, ghost, seasons and hidden magic ----
  // [name, emoji, days needed, thoughts needed]. A season never goes back down.
  const SEASONS = [[T.seasons[0], '🌱', 0, 0], [T.seasons[1], '🌼', 30, 30], [T.seasons[2], '🍂', 180, 150], [T.seasons[3], '❄️', 365, 400]];
  const PETS = ['', '🦋', '🐈', '🦉'];
  const fr = x => x - Math.floor(x);
  const rnd = (n, k) => fr(Math.sin(n * k) * 43758.5453);
  const mdOf = d => String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function ago(ms) {
    const m = Math.round((Date.now() - ms) / 6e4);
    if (m < 1) return T.now;
    if (m < 60) return T.min(m);
    const h = Math.round(m / 60);
    return h < 24 ? T.hrs(h) : T.days(Math.round(h / 24));
  }
  // Stars from different people sent within 10 minutes of each other
  function twinSet(ev) {
    const t = new Set();
    for (let i = 1; i < ev.length; i++)
      for (let j = i - 1; j >= 0 && ev[i].ts - ev[j].ts <= 6e5; j--)
        if (ev[j].sender !== ev[i].sender) { t.add(ev[i].n); t.add(ev[j].n); }
    return t;
  }
  // Extra line shown right after you send a thought
  function special() {
    const ev = state.events, n = ev.length, me = ev[n - 1];
    let s = '';
    if (ev.some(e => e.sender !== me.sender && me.ts - e.ts <= 6e5)) s += T.twin;
    if (n === 100) s += T.crown;
    if (n === 1000) s += T.galaxy;
    return s;
  }
  function drawSky() {
    const cv = $('cv'), ctx = cv.getContext('2d');
    const w = cv.clientWidth, h = cv.clientHeight, d = devicePixelRatio || 1;
    cv.width = w * d; cv.height = h * d; ctx.scale(d, d);
    const ev = state.events, n = ev.length, last = ev[n - 1];
    const days = n ? Math.max(1, Math.round((Date.now() - ev[0].ts) / 864e5)) : 0;
    let si = 0;
    SEASONS.forEach((s, i) => { if (days >= s[2] && n >= s[3]) si = i; });

    // the shared mothman: mood, costume, accessories, and the sleepy "waiting" state
    const now = new Date(), md = mdOf(now);
    const bd = (state.people || []).filter(p => p.birthday === md).map(p => p.name);
    const waiting = n > 0 && (Date.now() - last.ts) / 864e5 >= 3;
    $('ghost').setAttribute('class', waiting ? 'm-wait' : last ? 'm-' + last.mood : '');
    const cos = PREVIEW_COSTUME || costumeFor(now, bd.length > 0);
    $('costume').innerHTML = COSTUMES[cos] || '';
    $('acc').textContent = cos ? '' : n >= 100 ? '👑' : n >= 25 ? '🎩' : '';
    $('pet').textContent = PETS[si];

    // winter: nebulae
    if (si >= 3) {
      [['#8a5cff', .2, .3], ['#2fc4b2', .7, .5], ['#ff6aa0', .45, .75]].forEach(([c, x, y]) => {
        const g = ctx.createRadialGradient(x * w, y * h, 0, x * w, y * h, w * .4);
        g.addColorStop(0, c + '33'); g.addColorStop(1, c + '00');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      });
    }
    // 1000th thought: a galaxy
    if (n >= 1000) {
      ctx.fillStyle = 'rgba(236,233,255,.35)';
      for (let i = 0; i < 400; i++) for (let k = 0; k < 2; k++) {
        const a = i * .15 + k * Math.PI, r = 4 + i * .35;
        ctx.fillRect(w * .5 + Math.cos(a) * r * 1.2, h * .35 + Math.sin(a) * r * .6, 1.5, 1.5);
      }
    }
    const pos = ev.map(s => ({ x: rnd(s.n, 12.9898) * w, y: rnd(s.n, 78.233) * h * .85, r: 1.5 + rnd(s.n, 39.346) * 2.5, s }));
    lastPos = pos;
    // summer onward: constellations
    if (si >= 1) {
      ctx.strokeStyle = 'rgba(236,233,255,.18)'; ctx.lineWidth = 1; ctx.beginPath();
      pos.forEach((p, i) => { if (i % 6 !== 5 && pos[i + 1]) { ctx.moveTo(p.x, p.y); ctx.lineTo(pos[i + 1].x, pos[i + 1].y); } });
      ctx.stroke();
    }
    // the constellation you tapped glows gold
    if (hl >= 0) {
      ctx.strokeStyle = 'rgba(246,196,83,.85)'; ctx.lineWidth = 2; ctx.beginPath();
      pos.slice(hl * 6, hl * 6 + 6).forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
    }
    // stars, twin rings, and rare sparkles every 50th star (autumn onward)
    const tw = twinSet(ev);
    pos.forEach(p => {
      ctx.shadowColor = ctx.fillStyle = COL[p.s.mood] || '#fff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      if (tw.has(p.s.n)) { ctx.strokeStyle = '#f6c453'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4, 0, 7); ctx.stroke(); }
      if (si >= 2 && p.s.n % 50 === 0) {
        ctx.strokeStyle = '#fff6cf'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(p.x - 9, p.y); ctx.lineTo(p.x + 9, p.y); ctx.moveTo(p.x, p.y - 9); ctx.lineTo(p.x, p.y + 9); ctx.stroke();
      }
    });
    // winter: shooting stars and moons
    if (si >= 3) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.beginPath();
      [[.15, .15], [.7, .08], [.85, .4]].forEach(([x, y]) => { ctx.moveTo(x * w, y * h); ctx.lineTo(x * w + 50, y * h + 22); });
      ctx.stroke();
      ctx.font = '22px system-ui'; ctx.fillText('🌙', w * .8, h * .2); ctx.fillText('🌙', w * .1, h * .5);
    }
    // summer onward: flowers along the bottom
    if (si >= 1) { ctx.font = '18px system-ui'; for (let i = 0; i < 8; i++) ctx.fillText('🌼', (i + .3) * w / 8, h - 4); }

    // birthday constellation
    if (bd.length) {
      const P = [[.12, .1], [.2, .06], [.3, .1], [.38, .07], [.45, .15], [.38, .22], [.3, .17]].map(([x, y]) => [x * w, y * h]);
      ctx.strokeStyle = 'rgba(246,196,83,.8)'; ctx.lineWidth = 1.5; ctx.beginPath();
      P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.stroke();
      ctx.fillStyle = '#f6c453';
      P.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 7); ctx.fill(); });
    }

    // the sky dims gently while the mothman waits (nothing is lost)
    if (waiting) { ctx.fillStyle = 'rgba(20,19,43,.4)'; ctx.fillRect(0, 0, w, h); }

    // text
    const notes = [];
    if (bd.length) notes.push(T.bday(bd));
    if (n) {
      const f = new Date(ev[0].ts), yrs = now.getFullYear() - f.getFullYear();
      if (mdOf(f) === md && yrs > 0) notes.push(T.fday(yrs));
    }
    if (tw.size) notes.push(T.twins(tw.size));
    if (!$('cname').textContent) $('cname').textContent = 'Tap a star, or tap the mothman';
    $('s1').textContent = T.season + SEASONS[si][1] + ' ' + SEASONS[si][0];
    $('s2').textContent = n ? T.age(days) + (days >= 365 ? T.together(Math.floor(days / 365)) : '') : T.empty;
    $('s3').textContent = n ? T.thoughts + n : '';
    $('s4').textContent = n ? T.last + NAME[last.mood] + ' · ' + ago(last.ts) + (waiting ? T.waiting : '') : '';
    $('notes').replaceChildren(...notes.map(t => { const p = document.createElement('p'); p.textContent = t; return p; }));
  }

  // ---- costumes, constellation names, tapping ----
  const PREVIEW_COSTUME = '';   // to preview, set to 'witch', 'santa', 'newyear', 'valentine' or 'party', then clear it again
  const HAT = (path, fill) => '<path d="' + path + '" fill="' + fill + '"/>';
  const COSTUMES = {
    witch: HAT('M44 40 L60 6 L76 40 Z', '#3b2a63') + '<rect x="36" y="38" width="48" height="6" rx="3" fill="#3b2a63"/><rect x="47" y="30" width="26" height="4" fill="#f6a23c"/>',
    santa: HAT('M44 40 Q58 -4 86 24 L80 40 Z', '#d8404c') + '<rect x="42" y="36" width="42" height="8" rx="4" fill="#fff"/><circle cx="86" cy="24" r="6" fill="#fff"/>',
    newyear: HAT('M48 40 L60 6 L72 40 Z', '#5aa9ff') + '<circle cx="60" cy="6" r="4" fill="#f6c453"/><text x="98" y="22" font-size="20">🎉</text>',
    party: HAT('M48 40 L60 6 L72 40 Z', '#ff6aa0') + '<circle cx="60" cy="6" r="4" fill="#f6c453"/>',
    valentine: '<text x="22" y="34" font-size="18">💗</text><text x="100" y="26" font-size="14">💗</text>'
  };
  function costumeFor(d, birthday) {
    const m = d.getMonth() + 1, day = d.getDate();
    if (birthday) return 'party';
    if ((m === 10 && day >= 15) || (m === 11 && day === 1)) return 'witch';
    if (m === 12 && day <= 26) return 'santa';
    if (m === 12 || (m === 1 && day <= 3)) return 'newyear';
    if (m === 2 && day >= 7 && day <= 14) return 'valentine';
    return '';
  }

  const ADJ = ['Sleepy', 'Sneaky', 'Giggling', 'Grumpy', 'Cozy', 'Wobbly', 'Moonlit', 'Sparkly', 'Mysterious', 'Fluffy', 'Dizzy', 'Brave'];
  const NOUN = ['Teapot', 'Lantern', 'Biscuit', 'Sock', 'Umbrella', 'Toad', 'Kite', 'Teacup', 'Moth', 'Mushroom', 'Wheelbarrow', 'Owl'];
  const conName = g => T.con(g);
  let lastPos = [], hl = -1;

  // tap a star: meet its constellation (every 6 stars make one)
  $('cv').addEventListener('click', e => {
    const r = $('cv').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, dist = 30;
    lastPos.forEach(p => { const dd = Math.hypot(p.x - x, p.y - y); if (dd < dist) { dist = dd; best = p; } });
    if (!best) return;
    hl = Math.floor((best.s.n - 1) / 6);
    const have = Math.min(6, state.events.length - hl * 6);
    $('cname').textContent = '✨ ' + conName(hl) + (have < 6 ? T.forming(have) : '');
    drawSky();
  });

  // tap the mothman: a random trick, and a secret on the 7th quick tap
  let taps = 0, tapT = 0, fxTimer = 0;
  function poke() {
    const t = Date.now();
    taps = t - tapT < 4000 ? taps + 1 : 1; tapT = t;
    const fx = taps >= 7 ? 'confetti' : ['spin', 'hide', 'sneeze'][Math.floor(Math.random() * 3)];
    if (taps >= 7) taps = 0;
    const g = $('tapfx');
    g.setAttribute('class', ''); void g.getBoundingClientRect(); g.setAttribute('class', 'fx-' + fx);
    $('fx').textContent = { spin: '💫', hide: '👀', sneeze: '💨', confetti: '🎉🌟🎉' }[fx];
    $('cname').textContent = T.taps[fx];
    navigator.vibrate && navigator.vibrate(15);
    clearTimeout(fxTimer);
    fxTimer = setTimeout(() => { g.setAttribute('class', ''); $('fx').textContent = ''; }, 1400);
  }
  $('body').addEventListener('click', poke);
  $('body').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });

  // ---- start ----
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.title = T.title;
  document.querySelectorAll('[data-t]').forEach(el => (el.textContent = T[el.dataset.t]));
  moodButtons.forEach(b => (b.lastChild.textContent = T.moods[b.dataset.m]));
  $('ghost').setAttribute('aria-label', T.ghostLabel);
  $('body').setAttribute('aria-label', T.tapLabel);
  $('hi').textContent = T.hi;
  show();
  (async () => {
    if ('serviceWorker' in navigator) await navigator.serviceWorker.register('sw.js');
    if (!token) {
      $('hi').textContent = T.link;
      moodButtons.forEach(b => (b.disabled = true));
      return;
    }
    loadState();
    try {
      if (!(await isSupported())) return;
      messaging = getMessaging(initializeApp(G.firebase));
      onMessage(messaging, p => {            // a buzz arrives while the app is open
        $('msg').textContent = (p.data && p.data.body) || '';
        navigator.vibrate && navigator.vibrate([80, 60, 140]);
        loadState();
      });
      if (Notification.permission === 'granted') registerDevice().catch(() => {});
      else if (Notification.permission === 'default') $('buzz').hidden = false;
    } catch {}
  })();
</script>
</body></html>
